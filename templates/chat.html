<!DOCTYPE html>
<html>
<head>
<title>RedHat GSS Chatbot</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

/* -----------------------------
   GLOBAL LAYOUT (FULL SCREEN)
----------------------------- */
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
}

/* Main container */
#chatbox {
  display: flex;
  flex-direction: column;
  height: 100vh;     /* FULL SCREEN */
  width: 100%;
  background: white;
}

/* Header */
h2 {
  margin: 0;
  padding: 15px;
  border-bottom: 1px solid #ddd;
  background: #fff;
}

/* Messages area */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  background: #fafafa;
}

/* Optional: keep readable width on large screens */
#messages-content {
  max-width: 1000px;
  margin: auto;
}

/* Message styling */
.message {
  margin: 10px 0;
  line-height: 1.5;
}

.user {
  font-weight: bold;
}

.bot {
  color: #333;
}

.loading {
  color: gray;
  font-style: italic;
}

/* Input bar at bottom */
#input-area {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
  background: #fff;
}

#input {
  flex: 1;
  padding: 10px;
  font-size: 14px;
}

button {
  padding: 10px 15px;
  margin-left: 10px;
  cursor: pointer;
}

button:disabled {
  background: #ccc;
  cursor: not-allowed;
}

</style>
</head>

<body>

<div id="chatbox">

<h2>RedHat GSS Chatbot</h2>

<div id="messages">
  <div id="messages-content"></div>
</div>

<div id="input-area">
  <input id="input" placeholder="Ask something..." />
  <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

</div>

<script>

// -----------------------------------------------------
// ENTER KEY SUPPORT
// -----------------------------------------------------
document.getElementById("input").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});

// -----------------------------------------------------
// MAIN SEND FUNCTION
// -----------------------------------------------------
async function sendMessage() {

    let input = document.getElementById("input");
    let button = document.getElementById("sendBtn");

    let text = input.value.trim();

    if (!text) return;

    addMessage("You", text, "user");

    input.value = "";

    // Disable UI while processing
    button.disabled = true;

    let loadingMsg = addMessage("Bot", "Thinking...", "loading");

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        removeMessage(loadingMsg);

        addMessage("Bot", data.reply || "No response received.", "bot");

    } catch (error) {

        removeMessage(loadingMsg);

        addMessage(
            "Bot",
            " Error: Unable to fetch response. " + error.message,
            "bot"
        );
    }

    button.disabled = false;
}

// -----------------------------------------------------
// ADD MESSAGE
// -----------------------------------------------------
function addMessage(sender, text, cls) {

    let container = document.getElementById("messages-content");

    let div = document.createElement("div");
    div.className = "message " + cls;

    let safeHtml = marked.parse(text || "");

    div.innerHTML = "<b>" + sender + ":</b> " + safeHtml;

    container.appendChild(div);

    let messages = document.getElementById("messages");
    messages.scrollTop = messages.scrollHeight;

    return div;
}

// -----------------------------------------------------
// REMOVE MESSAGE (used for loading)
// -----------------------------------------------------
function removeMessage(element) {
    if (element && element.parentNode) {
        element.parentNode.removeChild(element);
    }
}

</script>

</body>
</html>
